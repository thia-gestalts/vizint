title: Area under the ROC curve (AUC)
intro: Move the decision threshold of a binary classifier to see the trade-off
  between true and false positives. The shaded area shows how well the
  classifier ranks positives above negatives.
type: engagement
frameHeight: 31rem
previewReady: "#roc-curve[d]"
patterns: [svg-plot, range-slider]
