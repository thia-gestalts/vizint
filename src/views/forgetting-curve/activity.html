<div id="formula" aria-live="polite"></div>
<svg id="plot" viewBox="0 0 640 290" role="group" aria-label="Recall probability over time since the last review">
  <g aria-hidden="true">
    <g id="grid"></g>
    <path id="guides" class="guides"/>
    <path id="curve" class="curve"/>
    <text class="axis-label" x="336" y="286">Days since review (Δ)</text>
    <text class="axis-label" transform="translate(14 136) rotate(-90)">Recall probability (p)</text>
  </g>
  <g class="handle half-life" id="half-life-handle" tabindex="0" role="slider" aria-label="Half-life h in days"
     aria-valuemin="0.5" aria-valuemax="20">
    <circle r="9"/>
    <text y="-16">h</text>
  </g>
  <g class="handle elapsed" id="elapsed-handle" tabindex="0" role="slider" aria-label="Days since review Δ"
     aria-valuemin="0" aria-valuemax="30">
    <circle r="9"/>
    <text y="-16">Δ</text>
  </g>
</svg>
<div class="controls">
  <label class="elapsed" for="elapsed">Δ, days since review <output id="elapsed-value" for="elapsed"></output></label>
  <input id="elapsed" type="range" min="0" max="30" step="0.5" value="7">
  <label class="half-life" for="half-life">h, half-life in days <output id="half-life-value" for="half-life"></output></label>
  <input id="half-life" type="range" min="0.5" max="20" step="0.5" value="5">
</div>
