title: Ebbinghaus forgetting curve
intro: Move Δ to let time pass since the last review, and h to change how
  durable the memory is. After one half-life, recall is a coin flip. Each
  further half-life halves it again.
type: engagement
patterns: [svg-plot, drag-handles, keyboard-handles, range-slider, live-formula]
source: Exponential forgetting after Ebbinghaus’s Über das Gedächtnis (1885), in
  the half-life form used by Settles and Meeder’s half-life regression (2016).
