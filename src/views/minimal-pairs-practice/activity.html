<main>
  <div id="dataset">
    <button type="button" id="open-license" aria-haspopup="dialog">Dataset notice</button>
  </div>
  <p id="status" role="status">Loading practice clips…</p>
  <button type="button" id="retry-load" hidden>Retry loading</button>
  <section id="practice" aria-label="Listening exercise" hidden>
    <div class="player">
      <div class="player-heading">
        <p id="prompt" tabindex="-1">Which spelling matches the audio?</p>
        <div class="controls">
          <button type="button" id="replay">Replay <kbd aria-hidden="true">Space</kbd></button>
          <button type="button" id="hide-clip">Hide clip</button>
        </div>
      </div>
      <audio controls preload="auto" aria-label="Practice clip"></audio>
      <p id="audio-status" role="status"></p>
      <p id="native" lang="zh" hidden></p>
    </div>
    <div id="answers" role="group" aria-labelledby="prompt"></div>
    <p id="feedback" role="status"></p>
  </section>
  <dialog id="license" aria-labelledby="license-title">
    <h2 id="license-title">Dataset license</h2>
    <p id="notice"></p>
    <div class="controls">
      <a id="license-link" target="_blank" rel="noopener noreferrer"></a>
      <button type="button" id="close-license">Close</button>
    </div>
  </dialog>
</main>
