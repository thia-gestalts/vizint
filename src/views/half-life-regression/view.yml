title: Shark fins of spaced repetition
intro: Every review resets recall to 1 and sets a new half-life from your
  history so far. Add reviews, mark them recalled or forgotten, and tune the
  weights Θ to see each forgetting curve grow a longer, flatter fin.
type: engagement
patterns: [svg-plot, drag-handles, keyboard-handles, range-slider, live-formula, click-to-add]
source: Half-life regression from Settles and Meeder, “A Trainable Spaced
  Repetition Model for Language Learning” (ACL 2016), with the Leitner weights
  θ⊕ = 1, θ⊖ = −1 as the starting point.
