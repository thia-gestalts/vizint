<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vizint CMS{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @layer components {
      .field { @apply w-full rounded border border-transparent bg-transparent px-1.5 py-0.5 hover:border-slate-300 focus:border-sky-500 focus:bg-white focus:outline-none; }
      .field[data-state=saving] { @apply border-amber-400 bg-amber-50; }
      .field[data-state=saved] { @apply border-emerald-400 bg-emerald-50; }
      .field[data-state=error] { @apply border-red-500 bg-red-50; }
      .chip { @apply inline-block rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600; }
      .btn { @apply rounded border border-slate-300 bg-white px-2 py-0.5 text-xs text-slate-700 hover:bg-slate-50; }
      .btn-x { @apply rounded px-1.5 text-slate-400 hover:bg-red-50 hover:text-red-600; }
      .label { @apply text-xs font-medium uppercase tracking-wide text-slate-500; }
      .card { @apply rounded-lg border border-slate-200 bg-white p-4 shadow-sm; }
    }
  </style>
</head>
<body class="bg-slate-50 text-sm text-slate-800">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-2">
      <a href="/" class="font-semibold">Vizint CMS</a>
      {% for href, label in [('/', 'Views'), ('/topics', 'Topics'), ('/datasets', 'Datasets')] %}
        <a href="{{ href }}" class="{{ 'text-sky-700 font-medium' if request.path == href or (href == '/' and request.path.startswith('/views')) else 'text-slate-600 hover:text-slate-900' }}">{{ label }}</a>
      {% endfor %}
      <span class="flex-1"></span>
      <span id="catalog" class="chip {{ '!bg-emerald-100 !text-emerald-800' if catalog.ok else '!bg-red-100 !text-red-800' }}"
            title="{{ catalog.error or 'src/catalog.mjs loads' }}">{{ 'catalog ok' if catalog.ok else 'catalog error' }}</span>
      <button class="btn" data-check>Run check:views</button>
    </nav>
    <div id="catalog-error" class="{{ '' if not catalog.ok else 'hidden' }} border-t border-red-200 bg-red-50 px-4 py-1 text-xs text-red-800">{{ catalog.error or '' }}</div>
  </header>
  <main class="mx-auto max-w-7xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="pointer-events-none fixed bottom-4 right-4 max-w-md rounded bg-slate-900 px-3 py-2 text-xs text-white opacity-0 transition-opacity"></div>
  <dialog id="check" class="m-auto w-[min(60rem,90vw)] rounded-lg p-0 backdrop:bg-black/30">
    <div class="flex items-center border-b px-4 py-2"><b id="check-title">check:views</b><span class="flex-1"></span>
      <form method="dialog"><button class="btn">Close</button></form></div>
    <pre id="check-output" class="max-h-[70vh] overflow-auto p-4 text-xs"></pre>
  </dialog>
  <script src="{{ url_for('static', filename='inline.js') }}"></script>
</body>
</html>
