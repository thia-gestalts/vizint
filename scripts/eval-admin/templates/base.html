<!doctype html>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>{% block title %}View evaluations{% endblock %}</title>
</head>
<body class="bg-slate-50 text-slate-900">

</html>
